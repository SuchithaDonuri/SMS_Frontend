<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login  Student Management System</title>
    <link rel="stylesheet" href="./css/loginpage.css">
    <!-- <link rel="stylesheet" href="../output.css"> -->
</head>
<body class="via-blue-50 to-slate-200">


    <main class="auth-container">
        
        <article class="login-card w-[360px] bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <header class="card-header text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Student Management System</h1>
                <p class="text-sm text-slate-500 mt-1">Please sign in to continue</p>
            </header>

            <form class="login-form" autocomplete="off">
                
                <div class="form-field">
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-1">User Role</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Choose your role...</option>
                        <option value="Principal">Principal</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Student">Student</option>
                        <option value="Parent">Parent</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="userid">User ID</label>
                    <input type="text" id="userid" name="userid" 
                           placeholder="Enter your ID" required autocomplete="username" 
                           class="w-full pl-3 pr-3 py-2 border border-slate-200 rounded-lg 
                           bg-white/80 backdrop-blur 
                           focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" 
                           placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-button ">Login to System</button>

            </form>

            <p id="errorMsg" style="color:red; text-align:center;" class="text-red-500 text-sm text-center mt-2"></p>
        </article>
        

    </main>

    <footer class="site-footer text-center text-sm text-gray-500 mt-6">
        <p>&copy; 2026 Student Management System. All rights reserved.</p>
    </footer>

    <script src="js/login.js"></script>

</body>
</html>
